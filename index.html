<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Antes de qualquer CSS: marca o que o JS vai fazer, para que estados escondidos de animação só
    existam quando o próprio JS confirmou que vai animar (FR-012, FR-018, research R6/R7).
    js      → JS executou
    motion  → e o visitante não pediu movimento reduzido (FR-020)
    booting → capa da porta de acesso, sempre que há JS, com ou sem movimento (feature 005, FR-010 a
              FR-012; constituição v3.0.0). A porta espera o clique, sem teto de tempo; os prazos
              abaixo são os de src/lib/boot.ts e só valem enquanto a porta não apareceu (research R2):
              - 2055 ms (GATE_LATEST_START_MS): sem o JS principal até aqui, não haverá porta (ela
                nunca cobre de repente uma página que o visitante já vê): a capa sai.
              - 3900 ms (APP_FAILED_MS): sem o JS principal, ele é dado como falho (app-failed): sai o
                movimento, e o que só fica completo parado volta ao estado final (FR-018 da 001; os
                loops de skills, FR-025 da 003; o header, FR-012 da 004). Com o JS principal, mas sem
                a porta na tela (html.gate), a capa sai: um erro na porta nunca prende a página.
              Os estados escondidos do v-reveal só existem depois que o app monta, então um bundle
              que falha não deixa nada invisível.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      var has = function (name) { return root.classList.contains(name); };
      var at = function (ms, fn) { setTimeout(fn, Math.max(0, ms - performance.now())); };
      root.classList.add('js', 'booting');
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('motion');
      at(2055, function () {
        if (!has('app-loaded')) root.classList.remove('booting');
      });
      at(3900, function () {
        if (!has('app-loaded')) {
          root.classList.remove('booting', 'motion');
          root.classList.add('app-failed');
        } else if (!has('gate')) {
          root.classList.remove('booting');
        }
      });
    })();
  </script>
  <!-- crossorigin é obrigatório em preload de fonte mesmo na mesma origem; o Vite aplica o base.
       O peso 800 (só as letras do nome, ~4 KB) desenha o <h1>, elemento de LCP: prioridade alta (SC-004) -->
  <link rel="preload" href="/fonts/iosevka-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/iosevka-aile-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/iosevka-800.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>&gt;_</text></svg>">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
