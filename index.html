<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Antes de qualquer CSS: marca o que o JS vai fazer, para que estados escondidos de animação só
    existam quando o próprio JS confirmou que vai animar (FR-012, FR-018, research R6/R7).
    js      → JS executou
    motion  → e o visitante não pediu movimento reduzido
    booting → tela de boot ativa; teto de 4,8 s mesmo que o bundle falhe (FR-031)
  -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        root.classList.add('motion', 'booting');
        setTimeout(function () { root.classList.remove('booting'); }, 4800);
      }
    })();
  </script>
  <!-- crossorigin é obrigatório em preload de fonte mesmo na mesma origem; o Vite aplica o base -->
  <link rel="preload" href="/fonts/iosevka-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/iosevka-aile-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>&gt;_</text></svg>">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
